  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

);\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap:   font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dd201e9b-53f5-48cb-9bd6-9b3af294eddc\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a1d22749-895c-4bc6-8d98-e2d6f67891ba\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e7731206-9530-4991-8d67-3c98df61d347\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody { margin:0; background:var(--color-bg); font-family:'Noto Sans Thai','Archivo',sans-serif; -webkit-font-smoothing:antialiased; }\nh1,h2,h3,h4,p,label,span,button,input,textarea,select { font-family:'Noto Sans Thai','Archivo',sans-serif; }\na { color:var(--color-accent-700); text-decoration:none; }\na:hover { color:var(--color-accent); text-decoration:underline; }\n.input { font-family:'Noto Sans Thai','Archivo',sans-serif !important; }\n*:focus-visible { outline:2px solid var(--color-accent); outline-offset:2px; }\n::selection { background:color-mix(in srgb, var(--color-accent) 24%, transparent); }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:var(--color-bg); color:var(--color-text);\">\n\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height:100vh; display:grid; grid-template-columns:1.05fr .95fr;\">\n    <div style=\"background:var(--color-text); color:var(--color-bg); padding:clamp(32px,5vw,72px); display:flex; flex-direction:column; justify-content:space-between; min-height:100vh;\">\n      <div style=\"display:flex; align-items:center; gap:12px;\">\n        <div style=\"{{ brandLogoStyleLg }}\"><\u002Fdiv>\n        <span style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:rgba(243,242,242,.7);\">School CMS<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--color-accent-400); margin:0 0 18px;\">ระบบจัดการเนื้อหาเว็บไซต์<\u002Fp>\n        <h1 style=\"font-size:clamp(32px,4.4vw,54px); line-height:1.1; font-weight:800; margin:0 0 20px; color:var(--color-bg); max-width:16ch;\">โรงเรียนบ้านหนองสระพังโนนสะอาด<\u002Fh1>\n        <p style=\"font-size:15px; line-height:1.7; margin:0; max-width:44ch; color:rgba(243,242,242,.72);\">แก้ไขข้อความ รูปภาพ วิดีโอ และลิงก์ทุกส่วนของเว็บไซต์ได้จากที่เดียว บันทึกแล้วหน้าเว็บจริงอัปเดตทันที<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:0; border-top:2px solid rgba(243,242,242,.24); padding-top:20px;\">\n        <span style=\"font-size:12.5px; color:rgba(243,242,242,.6);\">สพป.มหาสารคาม เขต 3 · ปีการศึกษา 2569<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; padding:clamp(28px,5vw,72px); background:var(--color-bg);\">\n      <form sc-camel-on-submit=\"{{ onLogin }}\" style=\"width:100%; max-width:420px;\">\n        <h2 style=\"font-size:28px; font-weight:800; margin:0 0 8px;\">เข้าสู่ระบบผู้ดูแล<\u002Fh2>\n        <p style=\"font-size:13.5px; line-height:1.6; margin:0 0 28px; color:color-mix(in srgb, var(--color-text) 65%, transparent);\">สำหรับผู้ดูแลระบบและครูที่ได้รับสิทธิ์จัดการเว็บไซต์<\u002Fp>\n        <div class=\"field\" style=\"margin-bottom:16px;\">\n          <label for=\"cms-user\">ชื่อผู้ใช้ หรือ อีเมล<\u002Flabel>\n          <input class=\"input\" id=\"cms-user\" type=\"text\" autocomplete=\"username\" placeholder=\"admin\" value=\"{{ loginUser }}\" sc-camel-on-change=\"{{ onLoginUser }}\">\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-bottom:20px;\">\n          <label for=\"cms-pass\">รหัสผ่าน<\u002Flabel>\n          <input class=\"input\" id=\"cms-pass\" type=\"password\" autocomplete=\"current-password\" placeholder=\"••••••••\" value=\"{{ loginPass }}\" sc-camel-on-change=\"{{ onLoginPass }}\">\n        <\u002Fdiv>\n        <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:13px; font-weight:700; color:var(--color-accent-700); margin:0 0 16px; padding:10px 12px; background:var(--color-accent-100); border-left:3px solid var(--color-accent);\">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง<\u002Fp>\n        <\u002Fsc-if>\n        <button type=\"submit\" class=\"btn btn-primary btn-block\">เข้าสู่ระบบ<\u002Fbutton>\n        <div style=\"margin-top:24px; border-top:2px solid var(--color-divider); padding-top:16px;\">\n          <p style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:color-mix(in srgb, var(--color-text) 50%, transparent); margin:0 0 8px;\">บัญชีทดลอง<\u002Fp>\n          <p style=\"font-size:13px; margin:0; line-height:1.7;\">ชื่อผู้ใช้ <strong>admin<\u002Fstrong> · รหัสผ่าน <strong>school2569<\u002Fstrong><br>เปลี่ยนรหัสผ่านได้ที่เมนู “บัญชีผู้ดูแล”<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showApp }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:grid; grid-template-columns:264px 1fr; min-height:100vh;\">\n\n    <aside style=\"background:var(--color-text); color:var(--color-bg); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto;\">\n      <div style=\"padding:22px 20px; border-bottom:2px solid rgba(243,242,242,.18); display:flex; align-items:center; gap:10px;\">\n        <div style=\"{{ brandLogoStyle }}\"><\u002Fdiv>\n        <div style=\"min-width:0;\">\n          <p style=\"font-size:13px; font-weight:800; margin:0; color:var(--color-bg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">หนองสระพังโนนสะอาด<\u002Fp>\n          <p style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; margin:2px 0 0; color:rgba(243,242,242,.55);\">Content Manager<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <nav style=\"display:flex; flex-direction:column; padding:12px 0; flex:1;\">\n        <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; flex-direction:column;\">\n            <p style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(243,242,242,.4); margin:14px 20px 6px;\">{{ g.label }}<\u002Fp>\n            <sc-for list=\"{{ g.items }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <button type=\"button\" data-id=\"{{ s.id }}\" sc-camel-on-click=\"{{ onNav }}\" style=\"display:flex; align-items:center; gap:10px; text-align:left; border:none; cursor:pointer; padding:9px 20px; font-size:13.5px; font-weight:600; background:{{ s.bg }}; color:{{ s.fg }}; border-left:3px solid {{ s.bar }};\" style-hover=\"background:rgba(243,242,242,.09);\">\n                <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"{{ s.icon }}\"><\u002Fpath><\u002Fsvg>\n                <span style=\"flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-family:'Space Mono',monospace; font-size:10.5px; color:rgba(243,242,242,.45);\">{{ s.badge }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fnav>\n\n      <div style=\"border-top:2px solid rgba(243,242,242,.18); padding:16px 20px; display:flex; align-items:center; gap:10px;\">\n        <div style=\"width:32px; height:32px; background:var(--color-accent); color:var(--color-bg); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex:none;\">{{ userInitial }}<\u002Fdiv>\n        <div style=\"flex:1; min-width:0;\">\n          <p style=\"font-size:12.5px; font-weight:700; margin:0; color:var(--color-bg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ userName }}<\u002Fp>\n          <p style=\"font-size:11px; margin:1px 0 0; color:rgba(243,242,242,.55);\">{{ userRole }}<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ onLogout }}\" title=\"ออกจากระบบ\" aria-label=\"ออกจากระบบ\" style=\"border:none; background:none; cursor:pointer; color:rgba(243,242,242,.7); padding:4px;\" style-hover=\"color:var(--color-bg);\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main style=\"min-width:0; display:flex; flex-direction:column;\">\n      <header style=\"position:sticky; top:0; z-index:20; background:var(--color-bg); border-bottom:2px solid var(--color-divider); padding:20px clamp(20px,3vw,40px); display:flex; align-items:flex-start; gap:20px; flex-wrap:wrap;\">\n        <div style=\"flex:1; min-width:240px;\">\n          <p style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1    <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isConnect }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:36px; align-items:start;\">\n            <section>\n              <h2 style=\"font-size:16px; font-weight:800; margin:0 0 16px; padding-bottom:10px; border-bottom:2px solid var(--color-divider);\">1 · เชื่อมต่อฐานข้อมูล Supabase<\u002Fh2>\n              <div class=\"field\" style=\"margin-bottom:16px;\">\n                <label for=\"sb-url\">Project URL<\u002Flabel>\n                <input class=\"input\" id=\"sb-url\" type=\"text\" placeholder=\"https://xxxxxxxx.supabase.co\" value=\"{{ sbUrl }}\" data-group=\"connect\" data-key=\"url\" sc-camel-on-change=\"{{ onField }}\">\n              <\u002Fdiv>\n              <div class=\"field\" style=\"margin-bottom:16px;\">\n                <label for=\"sb-key\">Anon public key<\u002Flabel>\n                <input class=\"input\" id=\"sb-key\" type=\"text\" placeholder=\"eyJhbGciOi...\" value=\"{{ sbKey }}\" data-group=\"connect\" data-key=\"key\" sc-camel-on-change=\"{{ onField }}\">\n              <\u002Fdiv>\n              <div class=\"field\" style=\"margin-bottom:20px;\">\n                <label for=\"sb-bucket\">Storage bucket สำหรับรูป/วิดีโอ<\u002Flabel>\n                <input class=\"input\" id=\"sb-bucket\" type=\"text\" placeholder=\"school-media\" value=\"{{ sbBucket }}\" data-group=\"connect\" data-key=\"bucket\" sc-camel-on-change=\"{{ onField }}\">\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap;\">\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ onTestConnection }}\">ทดสอบการเชื่อมต่อ<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onPullRemote }}\">ดึงข้อมูลล่าสุดจากฐานข้อมูล<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ onMigrateImages }}\" title=\"{{ pendingImagesTitle }}\" style=\"display:inline-flex; align-items:center; gap:10px;\">ย้ายรูปที่ฝังในข้อมูลขึ้น Storage\n                  <sc-if value=\"{{ hasPendingImages }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"flex:none; min-width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; background:#fff; color:var(--color-accent-700); font-size:12px; font-weight:800; letter-spacing:0;\">{{ pendingImages }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ noPendingImages }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex:none;\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExport }}\">ส่งออกข้อมูลเป็น JSON<\u002Fbutton>\n                <label class=\"btn btn-secondary\" style=\"cursor:pointer; margin:0;\">นำเข้าข้อมูลสำรอง\n                  <input type=\"file\" accept=\"application/json,.json\" sc-camel-on-change=\"{{ onImport }}\" style=\"display:none;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <p style=\"font-size:12.5px; margin:12px 0 0; color:var(--color-neutral-700);\">{{ pendingImagesTitle }}<\u002Fp>\n              <sc-if value=\"{{ migrateMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:13px; font-weight:700; margin:16px 0 0; padding:12px 14px; background:var(--color-accent-100); border-left:3px solid var(--color-accent);\">{{ migrateMsg }}<\u002Fp>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ connMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"font-size:13px; font-weight:600; margin:16px 0 0; padding:12px 14px; background:var(--color-surface); border-left:3px solid {{ connColor }};\">{{ connMsg }}<\u002Fp>\n              <\u002Fsc-if>\n\n              <h2 style=\"font-size:16px; font-weight:800; margin:34px 0 14px; padding-bottom:10px; border-bottom:2px solid var(--color-divider);\">2 · ขั้นตอนติดตั้งจริง<\u002Fh2>\n              <ol style=\"margin:0; padding-left:20px; font-size:13.5px; line-height:1.85;\">\n                <li>เข้า supabase.com → เปิดโปรเจกต์ของโรงเรียน<\u002Fli>\n                <li>เมนู <strong>SQL Editor<\u002Fstrong> → New query → วางสคริปต์ด้านขวาทั้งหมด → กด Run (รันครั้งเดียวพอ)<\u002Fli>\n                <li>เมนู <strong>Storage<\u002Fstrong> → New bucket → ตั้งชื่อ <strong>school-media<\u002Fstrong> → ติ๊ก Public bucket<\u002Fli>\n                <li>เมนู <strong>Authentication → Users<\u002Fstrong> → Add user → ใส่อีเมลและรหัสผ่านของผู้ดูแล (ติ๊ก Auto Confirm User)<\u002Fli>\n                <li>เมนู <strong>Project Settings → API<\u002Fstrong> → คัดลอก <strong>Project URL<\u002Fstrong> และ <strong>anon public key<\u002Fstrong> มาวางในช่องด้านซ้าย แล้วกด “ทดสอบการเชื่อมต่อ”<\u002Fli>\n                <li>กด <strong>บันทึกการเปลี่ยนแปลง<\u002Fstrong> หนึ่งครั้ง เพื่ออัปโหลดเนื้อหาปัจจุบันขึ้นฐานข้อมูลเป็นครั้งแรก<\u002Fli>\n                <li>ออกจากระบบแล้วเข้าใหม่ด้วย <strong>อีเมล + รหัสผ่านจากขั้นตอนที่ 4<\u002Fstrong> (ระบบจะเปลี่ยนไปใช้บัญชี Supabase อัตโนมัติ)<\u002Fli>\n                <li>อัปโหลดเว็บขึ้น <strong>Vercel<\u002Fstrong> แล้วเปิด <em>Tweaks<\u002Fem> ของหน้าเว็บ กรอก Project URL / anon key ชุดเดียวกัน เพื่อให้ผู้เข้าชมทุกคนเห็นข้อมูลจากฐานข้อมูล<\u002Fli>\n              <\u002Fol>\n              <p style=\"font-size:12.5px; line-height:1.7; margin:14px 0 0; padding:12px 14px; background:var(--color-surface); border-left:3px solid var(--color-text);\">ทั้ง Netlify, Vercel และ GitHub Pages เป็นโฮสต์ไฟล์แบบ static ที่ใช้ฟรีได้ ระบบล็อกอินและฐานข้อมูลอยู่ฝั่ง Supabase จึงไม่ต้องเช่าเซิร์ฟเวอร์เพิ่ม<\u002Fp>\n              <p style=\"font-size:12.5px; line-height:1.7; margin:16px 0 0; padding:12px 14px; background:var(--color-accent-100); border-left:3px solid var(--color-accent);\">ตอนนี้ระบบบันทึกข้อมูลไว้ในเครื่องของคุณ (บันทึกได้ ใช้งานได้จริง แต่ยังไม่แชร์ข้ามเครื่อง) เมื่อกรอกค่าเชื่อมต่อครบและอัปโหลดขึ้นโฮสต์แล้ว ข้อมูลจะย้ายไปอยู่บนฐานข้อมูลกลางทันที<\u002Fp>\n            <\u002Fsection>\n\n            <section>\n              <h2 style=\"font-size:16px; font-weight:800; margin:0 0 14px; padding-bottom:10px; border-bottom:2px solid var(--color-divider);\">สคริปต์สร้างตาราง (SQL)<\u002Fh2>\n              <pre style=\"margin:0 0 26px; padding:18px; background:var(--color-text); color:#e8e6e4; font-family:'Space Mono',monospace; font-size:11.5px; line-height:1.75; overflow:auto; max-height:460px;\">-- 1) ตารางเก็บเนื้อหาทั้งเว็บ (คีย์เดียว: 'cms')\ncreate table if not exists site_content (\n  key        text primary key,\n  data       jsonb not null,\n  updated_at timestamptz default now()\n);\n\nalter table site_content enable row level security;\n\n-- ผู้เข้าชมเว็บ: อ่านได้อย่างเดียว\ncreate policy \"public read\"  on site_content for select using (true);\n-- ผู้ดูแลที่ล็อกอินแล้ว: เพิ่ม/แก้ได้\ncreate policy \"admin insert\" on site_content for insert to authenticated with check (true);\ncreate policy \"admin update\" on site_content for update to authenticated using (true);\n\n-- 2) สิทธิ์ของ Storage bucket ชื่อ school-media\ncreate policy \"media public read\" on storage.objects\n  for select using (bucket_id = 'school-media');\ncreate policy \"media admin write\" on storage.objects\n  for insert to authenticated with check (bucket_id = 'school-media');\ncreate policy \"media admin update\" on storage.objects\n  for update to authenticated using (bucket_id = 'school-media');\ncreate policy \"media admin delete\" on storage.objects\n  for delete to authenticated using (bucket_id = 'school-media');<\u002Fpre>\n\n              <h2 style=\"font-size:16px; font-weight:800; margin:0 0 14px; padding-bottom:10px; border-bottom:2px solid var(--color-divider);\">โครงสร้างข้อมูลที่ระบบใช้จริง<\u002Fh2>\n              <p style=\"font-size:12.5px; line-height:1.7; margin:0 0 14px; color:color-mix(in srgb, var(--color-text) 70%, transparent);\">เนื้อหาทั้งเว็บถูกเก็บเป็นข้อมูลก้อนเดียวในแถวที่ key = 'cms' ของตาราง site_content ส่วนรูปภาพเก็บเป็นไฟล์ใน Storage bucket ชื่อ school-media โค้ดด้านล่างคือสิ่งที่ระบบทำให้อัตโนมัติ ไม่ต้องเขียนเพิ่ม<\u002Fp>\n              <pre style=\"margin:0; padding:18px; background:var(--color-text); color:#e8e6e4; font-family:'Space Mono',monospace; font-size:11.5px; line-height:1.75; overflow:auto; max-height:340px;\">const db = createClient(PROJECT_URL, ANON_KEY)\n\n// หน้าเว็บ: อ่านเนื้อหาทั้งหมด (แถวเดียว)\nconst { data } = await db\n  .from('site_content')\n  .select('data, updated_at')\n  .eq('key', 'cms')\n  .maybeSingle()\n\n// Admin: ล็อกอินผู้ดูแล\nawait db.auth.signInWithPassword({ email, password })\n\n// Admin: กดบันทึก = เขียนทับแถวเดิม\nawait db.from('site_content').upsert(\n  { key: 'cms', data: allContent, updated_at: new Date().toISOString() },\n  { onConflict: 'key' }\n)\n\n// Admin: อัปโหลดรูปเข้า Storage แล้วเก็บเฉพาะ URL\nconst { data: up } = await db.storage\n  .from('school-media')\n  .upload(path, file)\nconst url = db.storage.from('school-media')\n  .getPublicUrl(up.path).data.publicUrl<\u002Fpre>\n            <\u002Fsection>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; right:24px; bottom:24px; z-index:90; background:var(--color-text); color:var(--color-bg); padding:14px 20px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600;\">\n    <span style=\"width:8px; 9 โรงเรียนบ้านหนองสระพังโนนสะอาด · สพป.มหาสารคาม เขต 3' },\n    hero: { kicker:'สำนักงานเขตพื้นที่การศึกษาประถมศึกษามหาสารคาม เขต 3', title:'ได้เรียน เรียนดี มีความสุข', sub:'“เรียนดี มีวินัย ใฝ่พัฒนา รักษาสิ่งแวดล้อม เพียบพร้อมคุณธรรม ร่วมกิจกรรมชุมชน” สถานศึกษาที่มุ่งพัฒนาเด็กทุกคนให้เติบโตอย่างมีคุณภาพ เปิดสอนตั้งแต่ระดับปฐมวัย (อนุบาล 2–3) ถึงระดับประถมศึกษา (ป.1–6)', photo:'', ctaLabel:'ข่าวประชาสัมพันธ์', ctaLabel2:'ติดต่อเรา', ctaUrl:'#news', videoUrl:'https://www.youtube.com/embed/ImgFAc5CpHQ' },\n    about: { title:'ประวัติและข้อมูลทั่วไป', lead:'โรงเรียนมีหมู่บ้านหลักในเขตบริการ 3 หมู่ ได้แก่ หมู่ที่ 1 บ้านหนองสระพัง หมู่ที่ 3 บ้านโนนสะอาด และหมู่ที่ 15 บ้านหนองสระพัง โดยโรงเรียนตั้งอยู่หมู่ที่ 15 บ้านหนองสระพัง ตำบลเขวาไร่ อำเภอโกสุมพิสัย จังหวัดมหาสารคาม 44140 เป็นโรงเรียนในสังกัดศูนย์พัฒนาคุณภาพการศึกษาวังยาวเขวาไร่ดอนกลาง สำนักงานเขตพื้นที่การศึกษาประถมศึกษามหาสารคาม เขต 3 สำนักงานคณะกรรมการการศึกษาขั้นพื้นฐาน', history:'โรงเรียนบ้านหนองสระพังโนนสะอาด ก่อตั้งขึ้นเมื่อวันที่ 19 ตุลาคม พ.ศ. 2474 โดยใช้ศาลาการเปรียญวัดหนองสระพังจัดการเรียนการสอน ต่อมาในปี พ.ศ. 2482 ชาวบ้านได้จับจองหักร้างถางพงที่ดินแปลงใหม่เพื่อเป็นที่ตั้งโรงเรียนที่เป็นเอกเทศ บนเนื้อที่ 10 ไร่ 9 ตารางวา และได้ย้ายโรงเรียนมาสร้างในที่ดินแปลงใหม่จนถึงปัจจุบัน เพื่อความภาคภูมิใจในความเป็นเจ้าของร่วมกันของหมู่บ้านในเขตพื้นที่บริการ โรงเรียนได้รับอนุมัติให้เปลี่ยนชื่อใหม่เป็น “โรงเรียนบ้านหนองสระพังโนนสะอาด” อายุการก่อตั้งนับถึงสิ้นปีการศึกษา 2563 รวม 91 ปี', vision:'สู่คุณภาพและมาตรฐานการศึกษาด้วยวิธีการเรียนรู้ สอน และบริหาร ที่หลากหลาย', philosophy:'สุวิชาโน ภวังโหติ — ผู้รู้ดี คือผู้เจริญ', motto:'เรียนดี มีวินัย ใฝ่พัฒนา รักษาสิ่งแวดล้อม เพียบพร้อมคุณธรรม ร่วมกิจกรรมชุมชน', mission:'', directorName:'นายกิจภูมิ บุญอบ', directorRole:'ผู้อำนวยการโรงเรียน', directorPhoto:'assets/director-cutout-bg.png', directorMsg:'', students:'110 คน', teachers:'15 คน' },\n    contact: { address:'หมู่ที่ 15 บ้านหนองสระพัง ตำบลเขวาไร่ อำเภอโกสุมพิสัย จังหวัดมหาสารคาม 44140', phone:'062-601-7885', email:'jok เขตตรวจราชการที่ 12\", group:\"honor\" },\n      { title:\"นางสาวมยุเรศ เกษเพ็ชร — ครูต้นแบบการจัดการเรียนรู้บูรณาการทักษะชีวิต ประเภท ป.1–3 (ระดับทอง อันดับ 1)\", year:\"เขตตรวจราชการที่ 12\", group:\"honor\" },\n      { title:\"สถานศึกษาสีขาวปลอดยาเสพติดและอบายมุข รายงานผลระดับเพชร\", year:\"2567\", group:\"honor\" },\n      { title:\"โครงการสุขาดี มีความสุข\", year:\"ต่อเนื่อง\", group:\"health\" },\n      { title:\"กิจกรรมโรงเรียนดีวิถีลูกเสือ\", year:\"ต่อเนื่อง\", group:\"health\" },\n    ],\n    account: { name:'ผู้ดูแลระบบ', email:'admin@school.ac.th', newPass:'', confirmPass:'', recoveryEmail:'jokitboo@hotmail.com', lastLogin:'วันนี้' },\n  };\n\n  static ACCOUNTS = {\n    admin: { pass:'school2569', name:'ผู้ดูแลระบบ', role:'ผู้ดูแลเว็บไซต์' },\n  };\n\n  static STORE_KEY = 'nspnsa-cms-v3';\n  static SESSION_KEY = 'nspnsa-cms-session';\n\n  state = {\n    authed: false, user: null, loginUser: '', loginPass: '', loginError: false,\n    section: 'dashboard', data: Component.normalise(JSON.parse(JSON.stringify(Component.DEFAULT_DATA))),\n    dirty: false, toast: '', connMsg: '', connOk: false, savedAt: '', syncing: false, migrateMsg: '', remoteAt: '', authMode: 'local',\n    activity: [\n      { time:'วันนี้ 09:14', text:'อัปเดตข่าว \"ฟุตบอลหนองสระพังโนนสะอาด คัพ\"', by:'ผู้ดูแลระบบ' },\n      { time:'เมื่อวาน', text:'เพิ่มรูปกิจกรรมวันแม่ 6 ภาพ', by:'ครูธุรการ' },\n      { time:'3 ส.ค.', text:'แก้ไขเบอร์โทรศัพท์ในหน้าติดต่อ', by:'ผู้ดูแลระบบ' },\n      { time:'1 ส.ค.', text:'เพิ่มรายชื่อครูใหม่ 2 ท่าน', by:'ผู้ดูแลระบบ' },\n    ],\n  };\n\n  setImgPos(ds, x, y) {\n    this.mutate(d => {\n      const t = ds.list ? d[ds.list][+ds.idx] : d[ds.group];\n      const cur = Component.imgVals(t, ds.key, t[ds.key], null);\n      const nx = x == null ? cur.posX : Math.round(x), ny = y == null ? cur.posY : Math.round(y);\n      t[ds.key + 'Pos'] = nx + '% ' + ny + '%';\n    });\n  }\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(Component. onst ds = { ...e.currentTarget.dataset };\n        this.mutate(d => {\n          const t = ds.list ? d[ds.list][+ds.idx] : d[ds.group];\n          t[ds.key + 'Pos'] = '50% 50%'; t[ds.key + 'Zoom'] = 100; t[ds.key + 'Fit'] = '';\n        });\n      },\n      onToggleField: e => {\n        const el = e.target, ds = { ...el.dataset }, on = el.checked;\n        if (on && ds.list === 'banner' && ds.key === 'show') {\n          const idx = +ds.idx;\n          let removed = 0;\n          this.mutate(d => {\n            d.banner[idx].show = true;\n            const enabled = d.banner.map((b, i) => ({ b, i })).filter(x => x.b.show !== false && x.b.show !== 'no');\n            for (let k = enabled.length - 1; k >= 0 && enabled.length - removed > Component.BANNER_LIMIT; k--) {\n              if (enabled[k].i === idx) continue;\n              enabled[k].b.show = false;\n              removed += 1;\n            }\n          });\n          if (removed) this.flash(`หน้าแรกแสดงได้ ${Component.BANNER_LIMIT} รายการ — ปิดรายการล่างสุดให้อัตโนมัติ ${removed} รายการ`);\n          return;\n        }\n        this.mutate(d => { (ds.list ? d[ds.list][+ds.idx] : d[ds.group])[ds.key] = on; });\n      },\n      onPickImage: e => {\n        const el = e.target, ds = { ...el.dataset }, file = el.files && el.files[0];\n        if (!file) return;\n        const put = (suffix, val) => this.mutate(d => {\n          const t = ds.list ? d[ds.list][+ds.idx] : d[ds.group];\n          t[ds.key + suffix] = val;\n        });\n        const bucket = (st.data.connect || {}).bucket || 'school-media';\n        const folder = ds.list || ds.group;\n        const store = (suffix, blob, name) => {\n          const f = new File([blob], name, { type: blob.type || file.type });\n          if (this.online()) {\n            return window.SB.upload(this.cfg(), bucket, f, folder).then(res => {\n              if (res.ok) { put(suffix, res.url); return Math.round(f.size / 1024); }\n              return new Promise(r => { const rd = new FileReader(); rd.onload = () => { put(suffix, rd.result); r(Math.round(f.size / 1024)); }; rd.readAsDataURL(f); });\n            });\n          }\n          return new Promise(r => { const rd = new FileReader(); rd.onload = () => { put(suffix, rd.result); r(Math.round(f.size / 1024)); }; rd.readAsDataURL(f); });\n        };\n        this.flash('กำลังย่อขนาดรูป…');\n        Component.tinyPreview(file).then(t => { if (t) put('Tiny', t); });\n        Component.shrinkImage(file, ds.key).then(({ blob, name }) => store('', blob, name)).then(kb => {\n          this.flash('อัปโหลดรูปแล้ว (' + kb + ' KB) — อย่าลืมกดบันทึก');\n          if (/logo|director/i.test(ds.key || '')) { this.checkPendingImages(); return; }\n          Component.shrinkImage(file, ds.key, 800)\n            .then(({ blob, name }) => store('Sm', blob, name.replace(/(\\.[^.]+)$/, '-sm$1')))\n            .then(() => this.checkPendingImages());\n        });\n        el.value = '';\n      },\n      onAddItem: () => {\n        const store = sec.store, blank = {};\n        (Component.LIST_FIELDS[store] || []).forEach(f => { blank[f.key] = ''; });\n        this.mutate(d => { d[store] = [blank, ...(d[store] || [])]; });\n        this.flash('เพิ่มรายการใหม่ที่ด้านบนแล้ว');\n      },\n      onRemove: e => {\n        const i = +e.currentTarget.dataset.idx, store = sec.store;\n        this.mutate(d => { d[store].splice(i, 1); });\n        this.flash('ลบรายการแล้ว');\n      },\n      onDuplicate: e => {\n        const i = +e.currentTarget.dataset.idx, store = sec.store;\n        this.mutate(d => { d[store].splice(i + 1, 0, { ...d[store][i] }); });\n        this.flash('ทำสำเนารายการแล้ว');\n      },\n      onMove: e => {\n        const ds = e.currentTarget.dataset, i = +ds.idx, j = i + (+ds.dir), store = sec.store;\n        this.mutate(d => {\n          const arr = d[store];\n          if (j < 0 || j >= arr.length) return;\n          const [row] = arr.splice(i, 1); arr.splice(j, 0, row);\n        });\n      },\n      onSave: () => {\n        try { localStorage.setItem(Component.STORE_KEY, JSON.stringify(st.data)); } catch (e) {}\n        const now = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' }) + ' น.';\n        this.setState({ dirty: false, savedAt: now });\n        if (this.online()) {\n          this.setState({ syncing: true });\n          window.SB.save(this.cfg(), st.data).then(res => {\n            this.setState({ syncing: false });\n            this.flash(res.ok ? 'บันทึกขึ้นฐานข้อมูลแล้ว — หน้าเว็บอัปเดตทุกเครื่อง' : 'บันทึกในเครื่องแล้ว แต่ขึ้นฐานข้อมูลไม่สำเร็จ: ' + res.error);\n          });\n          return;\n        }\n        this.flash('บันทึกเรียบร้อย — หน้าเว็บอัปเดตแล้ว (เก็บในเครื่องนี้)');\n      },\n\n      sbUrl: D.connect.url, sbKey: D.connect.key, sbBucket: D.connect.bucket,\n      connMsg: st.connMsg, connColor: st.connOk ? 'var(--color-text)' : 'var(--color-accent)',\n      onTestConnection: () => {\n        const c = D.connect;\n        if (!c.url || !c.key) { this.setState({ connMsg: 'ยังไม่ได้กรอก Project URL และ anon key — ตอนนี้ระบบยังบันทึกลงเครื่องนี้อย่างเดียว', connOk: false }); return; }\n        if (!window.SB || !window.SB.ready()) { this.setState({ connMsg: 'ยังโหลดไลบรารี Supabase ไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', connOk: false }); return; }\n        if (!window.SB.configured(c)) { this.setState({ connMsg: 'รูปแบบ Project URL ไม่ถูกต้อง ต้องเป็น https://xxxx.supabase.co', connOk: false }); return; }\n        this.setState({ connMsg: 'กำลังทดสอบการเชื่อมต่อ…', connOk: true, syncing: true });\n        window.SB.ping(c).then(res => {\n          this.setState({ syncing: false });\n          if (res.ok) this.setState({ connMsg: 'เชื่อมต่อสำเร็จ — พบตาราง site_content พร้อมใช้งาน', connOk: true });\n          else this.setState({ connMsg: 'เชื่อมต่อไม่สำเร็จ: ' + res.error + ' (ตรวจว่ารันสคริปต์ SQL แล้วหรือยัง)', connOk: false });\n        });\n      },\n      migrateMsg: st.migrateMsg || '',\n      pendingImages: pending.total,\n      hasPendingImages: pending.total > 0,\n      noPendingImages: pending.total === 0,\n      pendingImagesTitle: pending.total\n        ? 'ฝังอยู่ในข้อมูล ' + pending.embedded + ' รูป · ยังไม่มีรูปย่อ/ตัวอย่าง ' + pending.thumbs + ' รูป'\n        : 'รูปทั้งหมดอยู่บน Storage แล้ว',\n      onMigrateImages: () => this.migrateImages(),\n      onPullRemote: () => { if (!this.online()) { this.flash('ยังไม่ได้เชื่อมต่อฐานข้อมูล'); return; } this.pullRemote(false); },\n      syncState: st.syncing ? 'กำลังซิงก์…' : (this.online() ? 'เชื่อมต่อฐานข้อมูลแล้ว' : 'โหมดเก็บในเครื่อง'),\n      syncColor: this.online() ? 'var(--color-text)' : 'color-mix(in srgb, var(--color-text) 55%, transparent)',\n      onExport: () => {\n        const blob = new Blob([JSON.stringify(st.data, null, 2)], { type:'application/json' });\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(blob);\n        a.download = 'school-content-backup.json';\n        a.click();\n        setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n        this.flash('ส่งออกไฟล์สำรองข้อมูลแล้ว');\n      },\n      onImport: e => {\n        const file = e.target.files && e.target.files[0];\n        if (!file) return;\n        const rd = new FileReader();\n        rd.onload = () => {\n          try {\n            const parsed = JSON.parse(rd.result);\n            if (!parsed || typeof parsed !== 'object') throw new Error('bad');\n            this.setState({ data: Component.normalise({ ...JSON.parse(JSON.stringify(Component.DEFAULT_DATA)), ...parsed }), dirty: true });\n            this.flash('นำเข้าข้อมูลสำรองแล้ว — ตรวจสอบแล้วกดบันทึก');\n          } catch (err) { this.flash('ไฟล์ไม่ถูกต้อง — ต้องเป็นไฟล์ JSON ที่ส่งออกจากระบบนี้'); }\n        };\n        rd.readAsText(file);\n        e.target.value = '';\n      },\n      toast: st.toast,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
